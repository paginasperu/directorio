<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#f5f5f7">
    <title>Página no encontrada · Directorio</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #1d1d1f;
            background: #f5f5f7;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        * { box-sizing: border-box; }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
        }

        main {
            width: min(100%, 480px);
            padding: 48px 32px;
            border: 1px solid #e5e5ea;
            border-radius: 24px;
            background: #fff;
            text-align: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: inherit;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
        }

        .brand img { width: 26px; height: 26px; }

        .code {
            margin: 40px 0 8px;
            color: #0071e3;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .12em;
        }

        h1 {
            margin: 0;
            font-size: clamp(26px, 7vw, 36px);
            letter-spacing: -.04em;
        }

        p {
            margin: 12px 0 28px;
            color: #6e6e73;
            font-size: 15px;
            line-height: 1.6;
        }

        .home {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            margin-top: 28px;
            padding: 0 20px;
            border-radius: 999px;
            background: #1d1d1f;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .home:hover { background: #333336; }
        .home:focus-visible, .brand:focus-visible { outline: 3px solid #0071e3; outline-offset: 4px; }

        @media (max-width: 480px) {
            main { padding: 36px 22px; }
        }
    </style>
</head>
<body>
    <main>
        <a class="brand" href="/" aria-label="Directorio, volver al inicio">
            <img src="assets/img/favicon.svg" alt="" width="26" height="26">
            Directorio
        </a>
        <p class="code">ERROR 404</p>
        <h1>Página no encontrada</h1>
        <a class="home" href="/">Volver al inicio</a>
    </main>
</body>
</html>
