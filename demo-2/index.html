<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio · Lista compacta</title>
    <meta name="description" content="Directorio de negocios en formato de lista compacta.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="demo-2.css">
</head>
<body>
    <div class="demo-bar">
        <div class="demo-bar-inner">
            <a href="../">← Demos</a>
            <span>Demo 2 · Lista compacta</span>
        </div>
    </div>

    <header class="top">
        <div class="top-inner">
            <a class="brand" href="./">Directorio</a>
            <div class="search">
                <input type="search" id="search" placeholder="Buscar negocio, producto o servicio" aria-label="Buscar negocio">
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="toolbar">
            <div class="filters">
                <select id="category" aria-label="Categoría"></select>
                <select id="floor" aria-label="Piso"></select>
                <select id="sort" aria-label="Orden">
                    <option value="name">Nombre A–Z</option>
                    <option value="piso">Piso</option>
                    <option value="promos">Con promoción</option>
                </select>
            </div>
            <p class="count" id="count">Cargando…</p>
        </div>

        <div class="table" role="table" aria-label="Negocios">
            <div class="thead" role="row">
                <span role="columnheader">Negocio</span>
                <span role="columnheader">Rubro</span>
                <span role="columnheader">Ubicación</span>
                <span role="columnheader">Promoción</span>
                <span role="columnheader"></span>
            </div>
            <div id="rows"></div>
            <div id="empty" class="empty hidden">Sin resultados. Prueba con otra búsqueda o filtro.</div>
        </div>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card" id="modalCard"></div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
