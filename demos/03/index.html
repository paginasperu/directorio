<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio · Demo 03</title>
    <meta name="description" content="Directorio de negocios del centro comercial: busca, filtra y descubre promociones.">
    <meta name="theme-color" content="#0b0f1e">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <a class="brand" href="../../">
            <span class="brand-mark">D</span>
            <span class="brand-name">Directorio</span>
        </a>
        <nav class="tabs-desktop" aria-label="Secciones">
            <button type="button" data-view="negocios" class="nav-btn is-active">Negocios</button>
            <button type="button" data-view="promos" class="nav-btn">Promociones</button>
            <button type="button" data-view="favoritos" class="nav-btn">Favoritos</button>
        </nav>
        <div class="topbar-actions">
            <button type="button" class="icon-btn" id="favBtn" aria-label="Favoritos">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.3-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.7-7 9-7 9Z"/></svg>
                <span class="badge" id="favCount" hidden>0</span>
            </button>
            <a class="demo-link" href="../../">Demos</a>
        </div>
    </header>

    <main class="page">

        <section class="search-block">
            <div class="search">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                <input type="search" id="q" placeholder="Buscar negocios, categoría o local" autocomplete="off" aria-label="Buscar negocios">
                <button type="button" class="filter-btn" id="filterBtn" aria-label="Filtros" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
                </button>
            </div>
            <div class="filters" id="filters" hidden>
                <label>
                    <span>Categoría</span>
                    <select id="fCategory"></select>
                </label>
                <label>
                    <span>Piso</span>
                    <select id="fFloor"></select>
                </label>
                <label>
                    <span>Orden</span>
                    <select id="fSort">
                        <option value="az">A–Z</option>
                        <option value="promos">Con promoción</option>
                        <option value="floor">Piso</option>
                    </select>
                </label>
                <button type="button" class="ghost-btn" id="clearFilters">Limpiar</button>
            </div>
        </section>

        <nav class="chips" id="chips" aria-label="Categorías"></nav>

        <section class="hero" id="hero">
            <p class="eyebrow">Centro comercial</p>
            <h1>Encuentra lo que necesitas, cerca de donde estás</h1>
            <p class="lead">Negocios, servicios y promociones del centro comercial, en un solo lugar.</p>
            <div class="hero-stats">
                <span><strong id="statBiz">0</strong> negocios</span>
                <span><strong id="statPromos">0</strong> promociones</span>
                <span><strong id="statFloors">0</strong> pisos</span>
            </div>
        </section>

        <section class="toolbar">
            <div>
                <h2 id="viewTitle">Negocios</h2>
                <p class="count" id="resultCount"></p>
            </div>
            <div class="toolbar-right">
                <button type="button" class="chip-btn" id="sortQuick">Ordenar</button>
                <div class="layout-toggle" role="group" aria-label="Vista">
                    <button type="button" data-layout="grid" aria-pressed="true" aria-label="Grilla">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.4"/><rect x="14" y="4" width="6" height="6" rx="1.4"/><rect x="4" y="14" width="6" height="6" rx="1.4"/><rect x="14" y="14" width="6" height="6" rx="1.4"/></svg>
                    </button>
                    <button type="button" data-layout="list" aria-pressed="false" aria-label="Lista">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                </div>
            </div>
        </section>

        <section class="grid" id="grid" aria-live="polite"></section>

        <section class="empty" id="empty" hidden>
            <h3>Sin resultados</h3>
            <p>Prueba con otra categoría, otro piso o borra la búsqueda.</p>
            <button type="button" class="primary-btn" id="resetAll">Limpiar filtros</button>
        </section>

    </main>

    <nav class="tabbar" aria-label="Navegación principal">
        <button type="button" data-view="negocios" class="tab is-active">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9Z"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <span>Negocios</span>
        </button>
        <button type="button" data-view="promos" class="tab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5h4l12 12-4 4L4 9Z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>
            <span>Promos</span>
        </button>
        <button type="button" data-view="favoritos" class="tab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.3-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.7-7 9-7 9Z"/></svg>
            <span>Favoritos</span>
        </button>
    </nav>

    <div class="modal" id="modal" hidden>
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button type="button" class="modal-close" id="modalClose" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
