<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demos · Directorio</title>
    <meta name="description" content="Demos del directorio de negocios.">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Directorio">
    <meta property="og:title" content="Demos · Directorio">
    <meta property="og:description" content="Demos del directorio de negocios.">
    <meta property="og:url" content="https://directorio.oficial.pe/">
    <meta property="og:image" content="https://directorio.oficial.pe/assets/img/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Demos · Directorio">
    <meta name="twitter:description" content="Demos del directorio de negocios.">
    <meta name="twitter:image" content="https://directorio.oficial.pe/assets/img/og-image.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1d1d1f;
            --ink-2: #6e6e73;
            --ink-3: #86868b;
            --line: #e5e5ea;
            --bg: #f5f5f7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; min-height: 100vh; display: flex; flex-direction: column; }

        header { display: flex; align-items: center; height: 52px; }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -.02em;
        }

        .brand-mark {
            display: block;
            width: 26px;
            height: 26px;
            border-radius: 7px;
            flex: none;
        }

        .brand span {
            padding: 2px 7px;
            border-radius: 999px;
            background: #e8e8ed;
            color: var(--ink-2);
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        main { flex: 1; padding: 28px 0 64px; }

        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

        .card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #fff;
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .card:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0, 0, 0, .07); }

        .card--soon { cursor: default; }

        .card--soon:hover { transform: none; box-shadow: none; }

        .thumb { aspect-ratio: 16 / 9; background: linear-gradient(135deg, #eef2f8, #e3e8f0); overflow: hidden; }

        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .body { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 18px; }

        .num { margin-top: 3px; flex: none; font-size: 11px; font-weight: 700; color: var(--ink-3); letter-spacing: .08em; }

        .card h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.02em; }

        .card p { margin: 5px 0 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.5; }

        @media (max-width: 720px) {
            .grid { grid-template-columns: minmax(0, 1fr); }
            .wrap { padding: 0 16px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <a class="brand" href="./"><img class="brand-mark" src="assets/img/favicon.svg" alt="" width="26" height="26">Directorio <span>demos</span></a>
        </header>

        <main>
            <div class="grid">
                <a class="card" href="demos/1/">
                    <div class="thumb">
                        <img src="assets/img/demo-1-portada.jpg" alt="Directorio, Minimalista" width="600" height="338">
                    </div>
                    <div class="body">
                        <span class="num">DEMO 1</span>
                        <div>
                            <h2>Minimalista</h2>
                        </div>
                    </div>
                </a>
                <div class="card card--soon" aria-disabled="true">
                    <div class="thumb">
                        <img src="assets/img/demo-2-construccion.svg" alt="Directorio, Demo 2 en construcción" width="600" height="338">
                    </div>
                    <div class="body">
                        <span class="num">DEMO 2</span>
                        <div>
                            <h2>En construcción</h2>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
