<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demos · Directorio</title>
    <meta name="description" content="Cinco direcciones visuales para un directorio de negocios.">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1d1d1f;
            --ink-2: #6e6e73;
            --ink-3: #86868b;
            --line: #e5e5ea;
            --bg: #f5f5f7;
            --blue: #0071e3;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

        header {
            display: flex;
            align-items: center;
            height: 52px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -.02em;
        }

        .brand span {
            padding: 2px 7px;
            border-radius: 999px;
            background: #e8e8ed;
            color: var(--ink-2);
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .hero { padding: 36px 0 26px; }

        .hero h1 {
            margin: 0;
            font-size: clamp(26px, 3.4vw, 36px);
            font-weight: 800;
            letter-spacing: -.035em;
            line-height: 1.1;
            max-width: 22ch;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            padding-bottom: 64px;
        }

        .card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #fff;
            transition: transform .18s ease, box-shadow .18s ease;
        }

        a.card:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0, 0, 0, .07); }

        .thumb {
            position: relative;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, #eef2f8, #e3e8f0);
            overflow: hidden;
        }

        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .thumb .soon {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: #a1a6b0;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .body {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 16px 18px 18px;
        }

        .num {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-3);
            letter-spacing: .08em;
        }

        .card h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.02em; }

        .card.muted { opacity: .7; }

        @media (max-width: 720px) {
            .grid { grid-template-columns: minmax(0, 1fr); }
            .hero { padding-top: 24px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <a class="brand" href="./">Directorio <span>demos</span></a>
        </header>

        <section class="hero">
            <h1>Cinco formas de mostrar el mismo directorio.</h1>
        </section>

        <main class="grid">
            <a class="card" href="demo-1/">
                <div class="thumb">
                    <img src="assets/img/demos/demo-1.jpg" alt="Demo 1" width="600" height="338">
                </div>
                <div class="body">
                    <span class="num">DEMO 1</span>
                    <h2>Clásico refinado</h2>
                </div>
            </a>

            <a class="card" href="demo-2/">
                <div class="thumb">
                    <img src="assets/img/demos/demo-2.jpg" alt="Demo 2" width="600" height="338">
                </div>
                <div class="body"><span class="num">DEMO 2</span><h2>Lista compacta</h2></div>
            </a>

            <a class="card" href="demo-3/">
                <div class="thumb">
                    <img src="assets/img/demos/demo-3.jpg" alt="Demo 3" width="600" height="338">
                </div>
                <div class="body"><span class="num">DEMO 3</span><h2>Editorial</h2></div>
            </a>

            <article class="card muted">
                <div class="thumb"><span class="soon">Próximamente</span></div>
                <div class="body"><span class="num">DEMO 4</span><h2>Mosaico</h2></div>
            </article>

            <article class="card muted">
                <div class="thumb"><span class="soon">Próximamente</span></div>
                <div class="body"><span class="num">DEMO 5</span><h2>Oscuro premium</h2></div>
            </article>
        </main>
    </div>
</body>
</html>
