<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista previa · Demo 02</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { box-sizing: border-box; }

        :root {
            --ink: #1d1d1f;
            --muted: #6e6e73;
            --line: #e5e5ea;
            --bg: #f5f5f7;
            --blue: #0071e3;
        }

        html, body { height: 100%; }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: none;
            padding: 9px 14px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .title {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }

        .title strong { font-size: 13px; letter-spacing: -.01em; }

        .title span { color: var(--muted); font-size: 11px; }

        .views {
            display: flex;
            gap: 4px;
            margin-left: auto;
            padding: 3px;
            background: var(--bg);
            border-radius: 10px;
        }

        .view {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 11px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .view:hover { color: var(--ink); }

        .view[aria-pressed="true"] {
            background: #fff;
            color: var(--ink);
            box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
        }

        .view svg { width: 15px; height: 15px; }

        .tools { display: flex; align-items: center; gap: 4px; }

        .icon-btn {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
        }

        .icon-btn:hover { background: var(--bg); }

        .icon-btn svg { width: 17px; height: 17px; }

        .open {
            color: var(--muted);
            font-size: 11px;
            text-decoration: none;
            padding: 0 2px;
        }

        .open:hover { color: var(--blue); text-decoration: underline; }

        main {
            flex: 1;
            overflow: auto;
            padding: 22px;
            background-image: radial-gradient(#d9d9de 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .fit {
            position: relative;
            margin: 0 auto;
            transition: width .18s ease, height .18s ease;
        }

        .stage {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            transition: transform .18s ease;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 10px 34px rgba(0, 0, 0, .14);
        }

        .size {
            position: sticky;
            bottom: 0;
            display: flex;
            justify-content: center;
            padding: 8px 0 0;
            color: var(--muted);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 620px) {
            header { flex-wrap: wrap; gap: 8px; }
            .views { margin-left: 0; order: 3; width: 100%; justify-content: space-between; }
            .title span { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="title">
            <strong>Demo 02 · vista responsive</strong>
            <span>Demo 02 en 3 tamaños</span>
        </div>

        <div class="views" role="group" aria-label="Tamaño de pantalla">
            <button class="view" type="button" data-view="movil" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M10.5 18.5h3"/></svg>
                Celular
            </button>
            <button class="view" type="button" data-view="tablet" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2.2"/><path d="M10 18h4"/></svg>
                Tablet
            </button>
            <button class="view" type="button" data-view="laptop" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="11.5" rx="1.8"/><path d="M2 19.5h20"/></svg>
                Laptop
            </button>
        </div>

        <div class="tools">
            <a class="open" href="demos/02/variantes.html" target="_blank" rel="noopener">Variantes</a>
            <a class="open" href="demos/02/" target="_blank" rel="noopener">Abrir</a>
            <button class="icon-btn" type="button" id="reload" title="Recargar el demo (R)" aria-label="Recargar el demo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>
            </button>
        </div>
    </header>

    <main id="stageWrap">
        <div class="fit" id="fit">
            <div class="stage" id="stage">
                <iframe id="frame" src="demos/02/" title="Demo 02"></iframe>
            </div>
        </div>
        <div class="size" id="size"></div>
    </main>

    <script>
        const views = {
            movil: { w: 390, h: 844, name: "Celular" },
            tablet: { w: 768, h: 1024, name: "Tablet" },
            laptop: { w: 1366, h: 768, name: "Laptop" }
        };

        const stage = document.getElementById("stage");
        const fit = document.getElementById("fit");
        const wrap = document.getElementById("stageWrap");
        const frame = document.getElementById("frame");
        const sizeLabel = document.getElementById("size");
        const buttons = [...document.querySelectorAll(".view")];
        let current = "movil";

        function render() {
            const view = views[current];
            const available = wrap.clientWidth - 44;
            const scale = Math.min(1, available / view.w);

            stage.style.width = view.w + "px";
            stage.style.height = view.h + "px";
            stage.style.transform = "scale(" + scale + ")";
            fit.style.width = view.w * scale + "px";
            fit.style.height = view.h * scale + "px";

            sizeLabel.textContent =
                view.name + " · " + view.w + " × " + view.h +
                (scale < 0.999 ? " · " + Math.round(scale * 100) + "%" : "");

            buttons.forEach((b) => {
                b.setAttribute("aria-pressed", String(b.dataset.view === current));
            });
        }

        function select(name) {
            current = name;
            render();
        }

        buttons.forEach((b) => {
            b.addEventListener("click", () => select(b.dataset.view));
        });

        document.getElementById("reload").addEventListener("click", () => {
            frame.contentWindow.location.reload();
        });

        window.addEventListener("resize", render);

        document.addEventListener("keydown", (e) => {
            if (e.target.closest("input, textarea")) return;
            if (e.key === "1") select("movil");
            if (e.key === "2") select("tablet");
            if (e.key === "3") select("laptop");
            if (e.key.toLowerCase() === "r") frame.contentWindow.location.reload();
        });

        frame.addEventListener("load", render);
        render();
    </script>
</body>
</html>
