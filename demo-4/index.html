<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio · Mosaico</title>
    <meta name="description" content="Directorio de negocios en mosaico.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="demo-4.css">
</head>
<body>
    <div class="demo-bar">
        <div class="demo-bar-inner">
            <a href="../">← Demos</a>
            <span>Demo 4 · Mosaico</span>
        </div>
    </div>

    <header class="top">
        <div class="top-inner">
            <a class="brand" href="./">Directorio<span class="dot"></span></a>
            <div class="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
                <input type="search" id="search" placeholder="Buscar negocio, producto o servicio" aria-label="Buscar">
            </div>
            <button type="button" id="promoToggle" class="ghost-btn" aria-pressed="false">Solo promos</button>
        </div>
    </header>

    <main class="wrap">
        <section id="hero" class="hero" aria-label="Destacado"></section>

        <nav id="categories" class="chips" aria-label="Categorías"></nav>

        <div class="grid-head">
            <h2 id="gridTitle">Todos los negocios</h2>
            <span id="count" class="count">Cargando…</span>
        </div>

        <section id="grid" class="bento" aria-label="Negocios"></section>
        <p id="empty" class="empty hidden">Nada por aquí. Prueba otra búsqueda.</p>
    </main>

    <footer class="foot">
        <span>Directorio gratuito e independiente</span>
        <span>85 negocios · 170 promociones referenciales</span>
    </footer>

    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-backdrop" data-close></div>
        <div class="sheet-panel" id="sheetPanel"></div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
